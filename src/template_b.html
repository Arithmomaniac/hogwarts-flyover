<script>
"use strict";
(async function main() {
  const cv = $("c");
  const gl = cv.getContext("webgl2", { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: true, powerPreference: "high-performance" });
  if (!gl) return fail("WebGL2 is not available in this browser.");

  const rendererName = rendererInfo && gl.getParameter(rendererInfo.UNMASKED_RENDERER_WEBGL);
  $("gpu-info").textContent = `GPU: ${rendererName || "adapter details unavailable"}`;
  const fLin = !!gl.getExtension("OES_texture_float_linear");
  const aniso = gl.getExtension("EXT_texture_filter_anisotropic");

  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  const TREE_N = 1440;               // 3D-tree table: one texel per 7 m tree cell, cells -720..719 (+-5 km round the castle)
  const CONE_ROWS = 2048 - TREE_N;   // band below the tree table: cone start per 8x8 block (columns < CG[0].c), max-height grid beyond
  // conservative max-height grid levels for the cone pre-pass: first column in the band, origin (m), cell size (m), cells per side
  const CG = [{ c: 240, o: -5120, s: 20, n: 512 }, { c: 752, o: -36480, s: 160, n: 456 }, { c: 1208, o: -36480, s: 1280, n: 57 }];
  const SHINGLE = 7, SHINGLE_BLUR = 0.8;   // the lake's shingle class, and the blur (texels) that smooths its edge

  // ---------------------------------------------------------------- data -> textures
  // the castle's distance-field layers (casA, casB) drew the raymarched castle; the meshes have replaced it
  const dec = {};
  try { await Promise.all(Object.keys(DATA.tex).filter((n) => !n.startsWith("cas")).map(async (n) => { dec[n] = await decode(n); })); }
  catch (e) { return fail("Could not decode the embedded data: " + e); }
  H.loc = { w: dec.locBed.w, h: dec.locBed.h, bed: dec.locBed.a, wd: dec.locW.a, cb: dec.locCB.a };
  for (const r of ["M", "A", "B"]) H[r] = { w: dec[r + "Bed"].w, h: dec[r + "Bed"].h, bed: dec[r + "Bed"].a, wd: dec[r + "W"].a };
  // the box (world x0, z0, x1, z1) round the water the shading pass mirrors the meshes in: the main lake, wholly on the
  // local grid; drawReflections draws only meshes whose mirror image could show through it
  const lakeBox = (() => {
    const L = H.loc, [[a, b, c], [d, e, f]] = M.local.aff, det = a * e - b * d;
    let i0 = Infinity, i1 = -Infinity, j0 = Infinity, j1 = -Infinity;
    for (let i = 0; i < L.h; i++) for (let j = 0; j < L.w; j++) {
      const k = i * L.w + j;
      if (L.wd[k] > 0 && Math.abs(L.bed[k] + L.wd[k] - M.lake) < 0.25) {   // frag5.glsl: the water the mirror serves
        i0 = Math.min(i0, i); i1 = Math.max(i1, i); j0 = Math.min(j0, j); j1 = Math.max(j1, j);
      }
    }
    if (i0 > i1) return null;
    const world = (u, v) => [(e * (u - c) - b * (v - f)) / det, (a * (v - f) - d * (u - c)) / det];
    const p = [[j0 - 1, i0 - 1], [j1 + 2, i0 - 1], [j0 - 1, i1 + 2], [j1 + 2, i1 + 2]].map(([j, i]) => world(j / L.w, i / L.h));
    return [Math.min(...p.map((q) => q[0])), Math.min(...p.map((q) => q[1])), Math.max(...p.map((q) => q[0])), Math.max(...p.map((q) => q[1]))];
  })();
  // The lake's shingle (surface class 7) as a smooth field in locB's red channel, which held the raymarched boundary
  // walls: its 2 m texels blurred, so a beach's edge follows the shore rather than the texel grid (groundAlb breaks it
  // with the classes' own noise). Under the beach the class map takes the nearest other class.
  {
    const N = dec.locN, B = dec.locB, w = N.w, h = N.h, n = w * h, R = 3;
    const k = Array.from({ length: 2 * R + 1 }, (_, i) => Math.exp(-((i - R) ** 2) / (2 * SHINGLE_BLUR * SHINGLE_BLUR)));
    const ks = k.reduce((a, b) => a + b), on = new Float32Array(n), rows = new Float32Array(n);
    for (let i = 0; i < n; i++) on[i] = N.a[N.ch * i] === SHINGLE ? 1 : 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0;
      for (let d = -R; d <= R; d++) s += k[d + R] * on[y * w + Math.min(Math.max(x + d, 0), w - 1)];
      rows[y * w + x] = s / ks;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0;
      for (let d = -R; d <= R; d++) s += k[d + R] * rows[Math.min(Math.max(y + d, 0), h - 1) * w + x];
      B.a[B.ch * (y * w + x)] = Math.round(255 * s / ks);
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!on[y * w + x]) continue;
      let c = 1;                                     // lawn, if no other class lies within six texels
      ring: for (let r = 1; r <= 6; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        const xx = x + dx, yy = y + dy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r || xx < 0 || yy < 0 || xx >= w || yy >= h || on[yy * w + xx]) continue;
        c = N.a[N.ch * (yy * w + xx)];
        break ring;
      }
      N.a[N.ch * (y * w + x)] = c;
    }
    // the class map rides in locB's third channel, which held the raymarched objects' far-step bound: groundAlb reads
    // it with texelFetch (nearest), so the class costs the shading pass no sampler of its own
    for (let i = 0; i < n; i++) B.a[B.ch * i + 2] = N.a[N.ch * i];

  function mkTex(w, h, ifmt, fmt, type, data, filt) {

    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);

    const c = L.cb ? 3 : 2, n = L.w * L.h, a = new Float32Array(n * c);

    return mkTex(d.w, d.h, f[0], f[1], gl.UNSIGNED_BYTE, d.a, filt);

    gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, d.img);
    gl.generateMipmap(gl.TEXTURE_2D);

    tBH: texRG(H.B), tBS: texJpg(dec.BSat),
    tFor: texU8(dec.forest, gl.LINEAR),

  };

    // spacing of it. Detail relief adds at most 1.7 * 0.775 m (1.4), vegetation at most 25.5 m + TREE_SAFE (29.35).

    const put = (g, G, x0, x1, z0, z1, v) => {
      const i0 = Math.floor((x0 - G.o) / G.s), i1 = Math.floor((x1 - G.o) / G.s), j0 = Math.floor((z0 - G.o) / G.s), j1 = Math.floor((z1 - G.o) / G.s);

      for (let j = Math.max(j0, 0), je = Math.min(j1, G.n - 1); j <= je; j++)

    for (const [nm, half, use] of [["M", 5005, (m, s) => m - s < 4990], ["A", 12015, (m, s) => m + s >= 4700 && m - s < 11990], ["B", 36060, (m, s) => m + s >= 11600]]) {
      const L = H[nm], sx = 2 * half / L.w, sz = 2 * half / L.h;
      for (let j = 0; j < L.h; j++) {
        const z = -half + (j + 0.5) * sz;
        for (let i = 0; i < L.w; i++) {
          const x = -half + (i + 0.5) * sx;
          if (!use(Math.max(Math.abs(x), Math.abs(z)), Math.max(sx, sz))) continue;
          const k = j * L.w + i;
          let x0 = x - sx, x1 = x + sx, z0 = z - sz, z1 = z + sz;

            if (i === 0) x0 = -Infinity; if (i === L.w - 1) x1 = Infinity; if (j === 0) z0 = -Infinity; if (j === L.h - 1) z1 = Infinity;
          }
          both(x0, x1, z0, z1, Math.max(L.bed[k], L.bed[k] + L.wd[k]));
        }
      }
    }
    {
      const L = H.loc, [[a, b, c], [d, e, f]] = M.local.aff, det = a * e - b * d;
      const rad = Math.hypot(e, d) / Math.abs(det) / L.w + Math.hypot(b, a) / Math.abs(det) / L.h;   // one texel along u plus one along v
      for (let j = 0; j < L.h; j++) {
        const v = (j + 0.5) / L.h - f;

          const u = (i + 0.5) / L.w - c, x = (e * u - b * v) / det, z = (a * v - d * u) / det, k = j * L.w + i;
          both(x - rad, x + rad, z - rad, z + rad, Math.max(L.bed[k], L.bed[k] + L.wd[k]));
        }
      }
    }
    let top = -Infinity;
    for (const g of [gF, gM]) for (let k = 0; k < g.length; k++) if (g[k] > top) top = g[k];
    for (const g of [gF, gM]) for (let k = 0; k < g.length; k++) g[k] = (g[k] === -Infinity ? top : g[k]) + ADD;
    const gA = new Float32Array(GA.n * GA.n).fill(-Infinity), q = GA.s / GM.s;
    for (let j = 0; j < GM.n; j++) for (let i = 0; i < GM.n; i++) {
      const k = Math.floor(j / q) * GA.n + Math.floor(i / q);
      gA[k] = Math.max(gA[k], gM[j * GM.n + i]);
    }
    gl.activeTexture(gl.TEXTURE20); gl.bindTexture(gl.TEXTURE_2D, T.tTree);
    for (const [G, g] of [[GF, gF], [GM, gM], [GA, gA]])

  }

  // ---------------------------------------------------------------- shader defines from the georeferenced essay layout
  const poi = (n) => X.poi.find((p) => p.name === n);
  const fl = (x) => { const s = (+x).toFixed(4); return s; };
  const v2 = (a) => `vec2(${fl(a[0])},${fl(a[1])})`;
  const brg = M.pitch.brg * Math.PI / 180, tw = M.towers;
  const defs = {
    LAKE: fl(M.lake), PITCH_C: v2(M.pitch.c), PITCH_DIR: v2([Math.sin(brg), Math.cos(brg)]),
    STATION: v2(poi("Hogsmeade station").p), GRAWP: v2(poi("Grawp's clearing").p), NTW: String(tw.length),
    CAS_CLS: `vec2[6](${M.castle.cls.map((c) => v2(c)).join(",")})`, TREE_N: String(TREE_N), TREE_G0: fl(TREE_N / 2),
    SATGAIN: "1.3", FOG_DENS: "(1.0/24000.0)", MESH_SH_LAYERS: "5",
    // lamplight behind lit windows: black-body tints in linear sRGB (candles ~2200 K, the train's lamps ~2700 K, dim
    // oil lamps ~2400 K); daylight-white glows would read as white once the night exposure lifts them
    CANDLE: "vec3(1.0,0.29,0.022)", LAMP: "vec3(1.0,0.4,0.095)", DIMLAMP: "vec3(1.0,0.34,0.06)",
  };
  // the glow (before the dusk ramp) of each lit glazing code, shared by the shading pass and the lake reflections;
  // strong enough to read as lamps but short of the tone curve's shoulder at the night exposure, where it would clip white
  const lampGlsl = `
vec3 lampGlow(int mat, float aux) {
  int k = int(aux + 0.5);
  //__LAMP_GLOW__
  return vec3(0.);
}`;
  [["CG_FINE", CG[0]], ["CG_MID", CG[1]], ["CG_FAR", CG[2]]].forEach(([k, g]) => { defs[k] = `vec4(${fl(g.c)},${fl(g.o)},${fl(g.s)},${fl(g.n)})`; });
  if (!fLin) defs.MANUAL_BILERP = "1";
  const fragSrc = $("fragSrc").textContent.replace("//__DEFINES__", Object.entries(defs).map(([k, v]) => `#define ${k} ${v}`).join("\n"))
    .replace("//__LAMPS__", lampGlsl);
  const vsSrc = "#version 300 es\nvoid main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }";
  const upSrc = `#version 300 es
precision highp float; uniform sampler2D tSrc; uniform vec2 uOut; out vec4 o;
float h(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
void main() { o = vec4(texture(tSrc, gl_FragCoord.xy / uOut).rgb + (h(gl_FragCoord.xy) - 0.5) / 255., 1.); }`;
  // temporal upsampling: jittered low-res samples + depth-reprojected, neighbourhood-clamped full-res history
  const taaSrc = `#version 300 es
precision highp float;
uniform sampler2D tCur, tHist; uniform vec2 uOut, uCur, uJit; uniform vec3 uPos, uPPos; uniform mat3 uRot, uPRot;
uniform float uTan, uAlpha; out vec4 o;
vec3 histCR(vec2 uv) {

  vec2 w0 = f * (-0.5 + f * (1. - 0.5 * f)), w1 = 1. + f * f * (-2.5 + 1.5 * f), w2 = f * (0.5 + f * (2. - 1.5 * f)), w3 = f * f * (-0.5 + 0.5 * f);
  vec2 w12 = w1 + w2, t0 = (tc - 1.) / uOut, t3 = (tc + 2.) / uOut, t12 = (tc + w2 / w12) / uOut;
  vec3 c = texture(tHist, vec2(t12.x, t0.y)).rgb * (w12.x * w0.y) + texture(tHist, vec2(t0.x, t12.y)).rgb * (w0.x * w12.y)
         + texture(tHist, t12).rgb * (w12.x * w12.y) + texture(tHist, vec2(t3.x, t12.y)).rgb * (w3.x * w12.y)
         + texture(tHist, vec2(t12.x, t3.y)).rgb * (w12.x * w3.y);
  return max(c / (w12.x * w0.y + w0.x * w12.y + w12.x * w12.y + w3.x * w12.y + w12.x * w3.y), 0.);

  // so the FAR_TILE variant (3D-tree path compiled out) gives the same result there as the full shader

  const clsSrc = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D tTree; uniform vec2 uRes; uniform float uTanHalf; out vec4 o;
void main() {

                fragSrc.replace("#version 300 es", "#version 300 es\n#define CONE_PASS 1"),

  }

  // A depth pre-pass draws the opaque meshes first: each pixel's nearest mesh distance is where P1 ends its march, and
  // its depth stays in the shared depth buffer. After the raymarch, a depth-only pass writes the raymarched hit where it
